# Synapse registration of the service (app_service_config_files).
# Both tokens are secrets. The service reads hs_token as HS_TOKEN.
id: twake-chat-visio
as_token: "<AS_TOKEN>"
hs_token: "<HS_TOKEN>"
sender_localpart: _twake_chat_visio
# No events: Synapse only relays the token requests (proxy_url).
url: null
# The service calls the homeserver on every token request.
rate_limited: false
namespaces:
  # Not exclusive: the service reads the power levels of a room as the caller.
  users:
    - exclusive: false
      regex: "@.*"
  aliases: []
  rooms: []
io.element.msc4502.scopes:
  - "urn:matrix:client:io.element.msc4502:rooms:is_joined"
io.element.msc4512.proxy_prefix: rtc/livekit
io.element.msc4512.proxy_url: "http://twake-chat-visio-side-service:8080"
